<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarilux Chatbox</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="chat-box">
            <div class="chat-header">
                <div class="header-copy">
                    <span class="header-pill">✦ Premium assistant</span>
                    <h1>Clarilux Chatbox</h1>
                    <p>Ask about steps, screenshots, and next actions with your assistant.</p>
                </div>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <p>Hello! I'm Clarilux Chatbox. How can I help you today?</p>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Type your message..." 
                        class="chat-input"
                        autocomplete="off"
                    >
                    <button id="sendBtn" class="send-btn">Send</button>
                </div>
                <button id="resetBtn" class="reset-btn">Reset Chat</button>
            </div>
        </div>
    </div>

    <!-- Professional Expand-on-Click Overlay Modal -->
    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <!-- Removed empty src and text to prevent broken text leak on load -->
        <img id="lightboxImg" alt="Screenshot preview">
    </div>
    
    <!-- 1. Loaded the Marked.js Markdown parser library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 2. Your custom application logic -->
    <script src="/static/script.js"></script>
</body>
</html>
